#cloud-config
# Template: the panel fills in the secrets placeholder (base64 of /etc/mc.env) and sends it as user_data.
# Code comes from the public repo; secrets never go to git.

package_update: true
package_upgrade: true
packages:
  - btop
  - micro
  - rclone
  - zstd
  - git
  - docker.io
  - docker-cli          # docker.io only recommends it on Debian 13
  - docker-compose

users:
  - name: malysh
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true   # no password, key-only login
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFV3k2PXPkmuK0d1rBJSbeHNQjeSnOwWAYYfEjgRJVTN malysh-laptop
    sudo: "ALL=(ALL:ALL) NOPASSWD:ALL"

ssh_pwauth: false
disable_root: true

swap:
  filename: /swapfile
  size: 2G

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf   # "10-": sshd uses the first value it finds
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers malysh
  - path: /etc/sysctl.d/99-swappiness.conf
    permissions: "0644"
    content: |
      vm.swappiness=10
  # All server secrets in one file. Deferred: written after user malysh exists.
  - path: /etc/mc.env
    owner: malysh:malysh
    permissions: "0600"
    encoding: b64
    content: __MC_ENV__
    defer: true

runcmd:
  - [systemctl, reload, ssh]
  - [sysctl, --system]
  - [docker, run, --rm, hello-world]   # fails loudly if docker is broken
  - [su, -, malysh, -c, "git clone -q https://github.com/emerald-rain/mc-infra.git"]
  # Agent and tunnel first, so the panel sees the server while the world is being restored
  - [cp, /home/malysh/mc-infra/server/agent/mc-agent.service, /etc/systemd/system/]
  - [systemctl, enable, --now, mc-agent]
  - [su, -, malysh, -c, "docker compose -f mc-infra/server/docker-compose.yml up -d cloudflared"]
  - [su, -, malysh, -c, "mc-infra/server/agent/start.sh"]
