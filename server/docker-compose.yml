# Started by agent/start.sh after the world is restored; cloudflared starts earlier from cloud-init.
services:

  # Minecraft itself; the world lives in ./data/world
  mc-server:
    container_name: mc-server
    image: itzg/minecraft-server:latest
    ports:
      - "25565:25565"
    environment:
      TYPE: "FABRIC"
      VERSION: "26.3"
      MEMORY: "80%"
      EULA: "TRUE"

      OPS: |
        sir_malysh07

      WHITELIST: |
        sir_malysh07
        sir_malysh05
        _SUDR_

      EXISTING_OPS_FILE: "SYNCHRONIZE"
      EXISTING_WHITELIST_FILE: "SYNCHRONIZE"

      DIFFICULTY: "hard"
      VIEW_DISTANCE: "12"
      SIMULATION_DISTANCE: "6"
      SPAWN_PROTECTION: "0"
      SYNC_CHUNK_WRITES: "false"
      MOTD: "§6KLADNASH IMMORTAL §8v:2§r\n§5Lovely❣ §6☀§r Vanilla+§8  v:26.3"

      MODRINTH_PROJECTS: |
        fabric-api:0.165.0+26.3
        lithium:mc26.3-0.26.3-fabric
        ferrite-core:9.0.0-fabric
        chunky:1.5.3
        quickleafdecay:1.0.0
        nocroptrample:1.6-26.3
    volumes:
      - ./data:/data
      - ./config:/config:ro
#      - ./mods:/mods:ro
    stop_grace_period: 60s

  # Tunnel for the panel: agent.knash.party -> localhost:8080 (the agent), set in Zero Trust.
  # Host network, because the agent listens on the host's localhost. stop.sh leaves it running.
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file: /etc/mc.env   # TUNNEL_TOKEN
    network_mode: host
    restart: unless-stopped
