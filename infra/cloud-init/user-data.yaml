#cloud-config
# Первая строка обязательна: по ней cloud-init понимает формат файла.
# Этот файл вставляется в поле "Cloud config" при создании сервера в Hetzner.

# --- Шаг 4.3 (замена): обновляем систему один раз при создании ---
package_update: true    # apt update
package_upgrade: true   # apt upgrade -y
packages:
  - tmux
  - htop
  - docker.io           # Docker из репозитория Debian: только демон dockerd
  - docker-cli          # команда docker (у docker.io она лишь в Recommends)
  - docker-compose      # в Debian 13 это уже Compose v2

# --- Шаг 2: свой пользователь и ключ ---
users:
  - name: malysh
    groups: [docker]                # то же, что usermod -aG docker
    shell: /bin/bash
    lock_passwd: true               # пароля нет вообще -> войти можно только по ключу
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFV3k2PXPkmuK0d1rBJSbeHNQjeSnOwWAYYfEjgRJVTN malysh-laptop
    # Пароля нет, поэтому sudo без пароля. Защиту даёт passphrase на ключе.
    sudo: "ALL=(ALL:ALL) NOPASSWD:ALL"

# --- Шаг 3: закрываем SSH ---
ssh_pwauth: false       # cloud-init сам выключит PasswordAuthentication
disable_root: true      # root не сможет войти по ключам, которые добавил Hetzner

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers malysh

runcmd:
  - [systemctl, reload, ssh]
  # Проверка: если docker не работает, команда упадёт и cloud-init покажет ошибку
  - [docker, run, --rm, hello-world]
