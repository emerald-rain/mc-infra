#cloud-config
# Paste into the "Cloud config" field when creating a server in Hetzner.

package_update: true
package_upgrade: true
packages:
  - btop
  - micro
  - rclone
  - docker.io
  - docker-cli          # docker.io only recommends it on Debian 13
  - docker-compose

users:
  - name: malysh
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true   # no password, key-only login
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFV3k2PXPkmuK0d1rBJSbeHNQjeSnOwWAYYfEjgRJVTN malysh-laptop
    sudo: "ALL=(ALL:ALL) NOPASSWD:ALL"

ssh_pwauth: false
disable_root: true

swap:
  filename: /swapfile
  size: 2G

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf   # "10-": sshd uses the first value it finds
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers malysh
  - path: /etc/sysctl.d/99-swappiness.conf
    permissions: "0644"
    content: |
      vm.swappiness=10

runcmd:
  - [systemctl, reload, ssh]
  - [sysctl, --system]
  - [docker, run, --rm, hello-world]   # fails loudly if docker is broken
