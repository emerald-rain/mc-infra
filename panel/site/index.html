    </svg>
    <div class="top-actions">
      <div class="pill" data-el="pill" role="status"><span class="dot" data-el="dot"></span><strong data-el="label">Loading…</strong></div>
      <button type="button" class="btn" data-el="action" hidden></button>
    </div>
  </header>

  <main class="cards">

    <section class="card" aria-label="Server">
      <div class="card-head"><h2>Server</h2></div>
      <div class="card-body">
        <p class="hint" data-el="hint"></p>
        <p class="error" data-el="error" hidden></p>
        <pre class="log" data-el="log" hidden></pre>
      </div>
    </section>

    <div class="address" data-el="address" hidden>
      <button type="button" class="copy" data-el="copyHostname" aria-label="Copy server domain">
        <span class="copy-text strong" data-el="hostname"></span>
        <svg class="icon-copy" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="2"/><path d="M10.5 3.5v-.5a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg>
        <svg class="icon-done" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>
      </button>
      <span class="or">or</span>
      <button type="button" class="copy" data-el="copyIp" aria-label="Copy server IP">
        <span class="copy-text" data-el="ip"></span>
        <svg class="icon-copy" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="2"/><path d="M10.5 3.5v-.5a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg>
        <svg class="icon-done" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>
      </button>
    </div>

  </main>

  <!-- Confirm sheet for stopping the server -->
  <div class="sheet" data-el="sheet" hidden>
    <button type="button" class="sheet-backdrop" data-el="close" aria-label="Close"></button>
    <section class="sheet-panel" role="dialog" aria-label="Shut down server">
      <span class="sheet-handle" aria-hidden="true"></span>
      <div class="sheet-text">
        <h2>Shut down server</h2>
        <p class="hint">Stops right away and disconnects everyone online. The world is backed up to R2, then the server is deleted.</p>
      </div>
      <div class="sheet-buttons">
        <button type="button" class="btn secondary" data-el="cancel">Cancel</button>
        <button type="button" class="btn stop" data-el="confirm">Shut down now</button>
      </div>
    </section>
  </div>

</div>

</body>
</html>
