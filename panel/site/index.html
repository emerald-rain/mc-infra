<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC Panel</title>
<link rel="stylesheet" href="/css/style.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>

<header class="page-header">
  <h1>KLADNASH</h1>
</header>

<main class="cards">

  <!-- Server: state, address, start/stop. Logic: js/server-card.js -->
  <section class="card" id="server-card">
    <h2>Server</h2>
    <div class="state"><span class="dot" data-el="dot"></span><span data-el="label">Loading…</span></div>
    <p class="hint" data-el="hint"></p>
    <div class="address" data-el="address" hidden>
      <span data-el="hostname"></span>
      <button type="button" data-el="copy">Copy</button>
    </div>
    <button type="button" class="primary" data-el="action" hidden></button>
    <p class="error" data-el="error" hidden></p>
    <pre class="log" data-el="log" hidden></pre>
  </section>

</main>

</body>
</html>
