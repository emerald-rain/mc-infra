# Panel: one Cloudflare Worker with the API (worker/) and the site (site/).
# Cloudflare deploys it on every push to main. Secrets: .dev.vars.example
name = "mc-admin"
main = "worker/index.js"
compatibility_date = "2026-11-01"

# Every request goes to the Worker first (password check), then to the site files
[assets]
directory = "site"
binding = "ASSETS"
run_worker_first = true

# Lets the Worker import server/cloud-init.yaml as text
[[rules]]
type = "Text"
globs = ["**/*.yaml"]
fallthrough = true

# World backups (r2:mc-world/backups), listed and downloaded by the panel
[[r2_buckets]]
binding = "WORLD"
bucket_name = "mc-world"

# Every minute: carry out the shutdown plan, delete the server once its backup is done
[triggers]
crons = ["* * * * *"]

[vars]
# Addresses
MC_HOSTNAME = "mc.knash.party"
AGENT_URL = "https://agent.knash.party"

# The Hetzner server
SERVER_NAME = "mc"
# Branch the server clones its code (agent, scripts) from; must match the deployed panel
REPO_BRANCH = "main"

# Defaults when the site does not choose
SERVER_TYPE = "cpx12"
LOCATION = "nbg1"
FIREWALL_NAME = "dev-fw"
SSH_KEY_NAME = "malysh-laptop"

# R2 bucket with world backups
R2_ENDPOINT = "https://a48fd80d5d5a24bcf34c2d4d7f4cd806.r2.cloudflarestorage.com"
